[project]
name = "shp-pipeline-qgis"
version = "0.1.0"
description = "Split shapefiles, validate with QGIS, and reproject to EPSG:3857."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=0.13",
    "shapely>=2.0",
    "pyproj>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
